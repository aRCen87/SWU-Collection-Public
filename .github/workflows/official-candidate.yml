name: Validate official community candidate
on:
  push:
    branches: ['release/official-community']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - working-directory: social
        run: npm ci --no-audit --no-fund
      - working-directory: social
        run: npm run test:official
      - run: node --test account-email/tests/*.test.mjs
  android:
    if: github.repository == 'aRCen87/SWU-Collection-Public' && github.actor == github.repository_owner
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 -m pip install 'cryptography>=44,<47' 'Pillow>=11,<13'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - run: python3 .github/scripts/verify_packaged_card_details.py app/build/outputs/apk/debug/app-debug.apk
      - name: Load permanent signing identity privately
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/swu-official.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/swu-official.jks" >> "$GITHUB_ENV"
      - name: Prepare the isolated official backend
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          java .github/scripts/DecryptOfficialConfig.java docs/official-backend-config.enc.properties
          python3 .github/scripts/check_official_backend.py
      - name: Verify the optimized signed candidate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease
          python3 .github/scripts/verify_packaged_card_details.py app/build/outputs/apk/release/app-release.apk
          python3 .github/scripts/prepare_release.py > "$RUNNER_TEMP/official-candidate-metadata.json"
          gradle --stop
      # No publisher or downloadable candidate APK in this validation workflow.
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise official UI and collection on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15917651
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot-save -feature GLESDynamicVersion
          script: |
            mkdir -p smoke-private
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm grant fr.swucollection.app android.permission.POST_NOTIFICATIONS
            SWU_SMOKE_PACKAGE=fr.swucollection.app python3 .github/scripts/check_premium_collection.py
            python3 .github/scripts/check_official_account_entry.py
            python3 .github/scripts/check_official_upgrade.py
