name: Validate official community candidate
on:
  push:
    branches: ['release/official-community']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - working-directory: social
        run: npm ci --no-audit --no-fund
      - working-directory: social
        run: npm run test:official
      - run: node --test account-email/tests/*.test.mjs
  android:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 -m pip install 'cryptography>=44,<47' 'Pillow>=11,<13'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - run: python3 .github/scripts/verify_packaged_card_details.py app/build/outputs/apk/debug/app-debug.apk
      # This workflow deliberately has no publisher. The final public workflow is
      # blocked until backend configuration and end-to-end upgrade checks exist.
