name: Validate and deliver collection Test 39
on:
  push:
    branches: ["preview/collection-inventory-test39"]
    paths-ignore: ["docs/preview-update.json"]
permissions:
  contents: read
concurrency:
  group: swu-test39-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'aRCen87/SWU-Collection-Public' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: python3 -m pip install 'cryptography>=44,<47' 'Pillow>=11,<13'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Load permanent signature and isolated Test configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/test39.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/test39.jks"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          java .github/scripts/DecryptPreviewConfig.java docs/test-backend-config.enc.properties
      - name: Check Android and build the signed Test application
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon --no-parallel --max-workers=1 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" testDebugUnitTest lintDebug assembleDebug testPreviewUnitTest lintPreview assemblePreview
          python3 .github/scripts/verify_packaged_card_details.py app/build/outputs/apk/preview/app-preview.apk
      - name: Verify permanent certificate and Test identity
        run: |
          apk=app/build/outputs/apk/preview/app-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/test39-certificate.txt"
          grep -qi '54912449ae2e4ecd6e88243d3e11fb0bb2c1d2e7da77af2038752ee50e7b549b' "$RUNNER_TEMP/test39-certificate.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/test39-identity.txt"
          grep -q "package: name='fr.swucollection.app.test' versionCode='104' versionName='0.9.8-test.39'" "$RUNNER_TEMP/test39-identity.txt"
      - name: Encrypt verified Test APK for private recovery
        run: python3 .github/scripts/encrypt_private_preview.py docs/preview-recipient-test39-public.pem app/build/outputs/apk/preview/app-preview.apk distribution-private
      - uses: actions/upload-artifact@v4
        with:
          name: SWU-Collection-Test39-encrypted
          retention-days: 30
          path: distribution-private/
          if-no-files-found: error
