name: Android APK
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_official:
        description: "Publier officiellement après accord explicite de Romain"
        required: true
        type: boolean
        default: false
      approved_sha:
        description: "SHA complet des sources approuvées (requis pour publier)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test data matching and publication validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Test and check Android code
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify packaged debug card details
        run: python3 .github/scripts/verify_packaged_card_details.py app/build/outputs/apk/debug/app-debug.apk
      - name: Check optimized release without the permanent signing key
        if: github.event_name == 'pull_request'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/swu-ci.jks" -storepass ci-test-only -keypass ci-test-only -alias swu-release -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI test only"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/swu-ci.jks" ANDROID_KEYSTORE_PASSWORD=ci-test-only gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Verify packaged optimized release card details
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/verify_packaged_card_details.py app/build/outputs/apk/release/app-release.apk
      - name: Decode permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/swu-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/swu-release.jks" >> "$GITHUB_ENV"
      - name: Prepare the official backend configuration
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -f docs/official-backend-config.enc.properties || { echo 'Official backend is not configured. Public release is blocked.' >&2; exit 1; }
          java .github/scripts/DecryptOfficialConfig.java docs/official-backend-config.enc.properties
          python3 .github/scripts/check_official_backend.py
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Verify packaged signed release card details
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/verify_packaged_card_details.py app/build/outputs/apk/release/app-release.apk
      - name: Preserve tested APK for startup verification
        uses: actions/upload-artifact@v4
        with:
          name: swu-startup-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Prepare verified release metadata
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/prepare_release.py > app/build/outputs/apk/release/release-metadata.json
      - name: Upload signed APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: swu-collection-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/release-metadata.json
          if-no-files-found: error
      - name: Upload private R8 mapping
        if: github.event_name != 'pull_request' && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: swu-collection-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  startup:
    name: Verify Android startup and primary navigation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install tools for the signed upgrade check
        run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: swu-startup-apk
          path: app/build/outputs/apk/release
      - run: python3 -m pip install "Pillow>=11,<13"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the final optimized APK twice on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SWU_RELEASE_VALIDATION: ${{ github.event_name != 'pull_request' }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-build: 15917651
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot-save -feature GLESDynamicVersion
          script: |
            mkdir -p smoke-private
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm grant fr.swucollection.app android.permission.POST_NOTIFICATIONS
            SWU_SMOKE_PACKAGE=fr.swucollection.app python3 .github/scripts/check_premium_collection.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app python3 .github/scripts/check_test19_usability.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app python3 .github/scripts/check_collection_workbench.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app python3 .github/scripts/check_private_fold_interactions.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app python3 .github/scripts/check_match_counter.py
            adb shell am force-stop fr.swucollection.app
            adb shell am start -W -n fr.swucollection.app/fr.swucollection.app.MainActivity
            sleep 8
            if [ "$SWU_RELEASE_VALIDATION" = true ]; then
              python3 .github/scripts/check_official_account_entry.py
              python3 .github/scripts/check_official_upgrade.py
            fi
      - name: Upload startup verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swu-startup-verification
          path: smoke-private/
          if-no-files-found: ignore

  publish:
    name: Publish finalized application update
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_official == true && inputs.approved_sha == github.sha
    needs: [build, startup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Check publication authorization
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          test -n "$RELEASES_TOKEN" || { echo "Publication blocked: configure RELEASES_TOKEN with Contents read/write limited to aRCen87/SWU-Collection-Releases." >&2; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: swu-collection-release
          path: distribution
      - name: Verify and publish signed update
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: python3 .github/scripts/publish_release.py distribution/app-release.apk distribution/release-metadata.json

