name: Appli Playstore validation
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/playstore-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playstore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test standalone edition and build Android App Bundle
        run: gradle --no-daemon testPlaystoreUnitTest lintPlaystore bundlePlaystore
      - name: Check standalone manifest
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths=list(Path('app/build/intermediates').glob('merged_manifests/playstore/**/AndroidManifest.xml'))
          assert paths, 'Merged Playstore manifest missing'
          root=ET.parse(paths[0]).getroot()
          ns='{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package']=='fr.swucollection.app.playstore'
          permissions={e.get(ns+'name') for e in root.findall('uses-permission')}
          assert 'android.permission.REQUEST_INSTALL_PACKAGES' not in permissions
          assert 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' not in permissions
          assert not any(e.get(ns+'name','').endswith(('RealtimeMessagingService','FirebaseInitProvider')) for e in root.iter())
          assert not any(e.get(ns+'host')=='account' for e in root.iter('data'))
          print('Standalone manifest verified')
          PYCODE
      - name: Keep unsigned Playstore candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: appli-playstore-unsigned-aab
          path: app/build/outputs/bundle/playstore/*.aab
          if-no-files-found: error
