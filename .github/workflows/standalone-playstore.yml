name: Standalone Playstore 0.1.0
on:
  push:
    branches: [playstore/standalone-0.9.11]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standalone-playstore
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate separate application without modifying official sources
        run: |
          python3 -m unittest discover -s playstore -p 'test_*.py'
          python3 playstore/prepare.py build/playstore-source
          git diff --exit-code -- app
      - name: Test remaining features and build standalone APK and bundle
        run: gradle -p build/playstore-source --no-daemon testDebugUnitTest lintDebug assembleDebug testReleaseUnitTest lintRelease assembleRelease bundleRelease
      - name: Verify absence of account services in optimized package
        run: python3 playstore/verify_package.py build/playstore-source/app/build/outputs/apk/release/app-release-unsigned.apk "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Prepare temporary emulator signature without official credentials
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass smoke-only -keypass smoke-only -alias smoke -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Playstore verification'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:smoke-only --out build/playstore-source/app/build/outputs/apk/release/app-release.apk build/playstore-source/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Prepare Android regression checks for standalone identity
        run: |
          python3 -m pip install 'Pillow>=11,<13'
          python3 - <<'PY'
          from pathlib import Path
          for name in ('check_premium_collection','check_test19_usability','check_collection_workbench','check_private_fold_interactions','check_match_counter'):
              p=Path('.github/scripts')/(name+'.py')
              s=p.read_text().replace("('fr.swucollection.app', 'fr.swucollection.app.test')", "('fr.swucollection.app', 'fr.swucollection.app.test', 'fr.swucollection.app.playstore')")
              p.write_text(s)
          PY
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise account-free app, local features and Fold layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-build: 15917651
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot-save -feature GLESDynamicVersion
          script: |
            python3 playstore/smoke.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app.playstore python3 .github/scripts/check_premium_collection.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app.playstore python3 .github/scripts/check_test19_usability.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app.playstore python3 .github/scripts/check_collection_workbench.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app.playstore python3 .github/scripts/check_private_fold_interactions.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app.playstore python3 .github/scripts/check_match_counter.py
            python3 playstore/coexistence.py
      - name: Preserve verified Playstore bundle and standalone sources
        uses: actions/upload-artifact@v4
        with:
          name: SWU-Playstore-0.1.0
          path: |
            build/playstore-source/app/build/outputs/bundle/release/*.aab
            build/playstore-source/app/src/
            build/playstore-source/app/*.kts
            build/playstore-source/*.kts
            build/playstore-source/gradle.properties
          if-no-files-found: error
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Playstore-verification
          path: |
            build/playstore-source/app/build/test-results/
            build/playstore-source/app/build/reports/
            smoke-playstore/
            smoke-private/
            smoke-premium/
