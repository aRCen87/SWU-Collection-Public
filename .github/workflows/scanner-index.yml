name: Prepare detailed scanner index
on:
  push:
    branches: ["scanner-regions-details"]
    paths: [".github/workflows/scanner-index.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    if: github.ref == 'refs/heads/scanner-regions-details'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/cache/restore@v4
        with:
          path: .visual-image-cache
          key: scan-images-${{ github.run_id }}
          restore-keys: scan-images-
      - run: python -m pip install 'Pillow>=11,<14'
      - name: Generate details from previously verified images only
        run: python .github/scripts/build_scan_visual_index.py --cached-only --cache .visual-image-cache
      - name: Verify catalogue identity and full index coverage
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Save the generated index on its working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/scan-visual-index.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build detailed scanner index from verified image cache"
          git push origin HEAD:scanner-regions-details
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detailed-scanner-index
          path: app/src/main/assets/scan-visual-index.json.gz
          if-no-files-found: error
