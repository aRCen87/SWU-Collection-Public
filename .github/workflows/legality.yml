name: Official card legality
on:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync_legality.py'
      - '.github/workflows/legality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-legality-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text reader
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Validate parser
        run: python3 -m unittest discover -s .github/scripts -p 'test_legality.py'
      - name: Refresh official rules and publish data only
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLISH_LEGALITY: '1'
        run: python3 .github/scripts/sync_legality.py
