name: Encrypted SWU Collection Test
on:
  push:
    branches: ["preview/private-sandbox", "preview/profile-avatars-test17", "preview/reliability-test18", "preview/performance-test19", "preview/premium-design-test20", "preview/immersive-home-test21", "preview/home-fade-test22"]
    paths-ignore: ["docs/preview-update.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-swu-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    if: github.repository == 'aRCen87/SWU-Collection-Public' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify private profiles and conversation access
        working-directory: social
        run: |
          npm ci --no-audit --no-fund
          npm test
  build:
    needs: security
    if: github.repository == 'aRCen87/SWU-Collection-Public' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aRCen87/SWU-Collection-Public
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false
      - name: Load permanent signing identity privately
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/swu-preview.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/swu-preview.jks" >> "$GITHUB_ENV"
      - name: Prepare the isolated test backend configuration
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: java .github/scripts/DecryptPreviewConfig.java docs/test-backend-config.enc.properties
      - run: python3 -m pip install 'cryptography>=44,<47' 'Pillow>=11,<13'
      - name: Test stable code and the isolated preview
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          for attempt in 1 2 3; do
            set +e
            gradle --no-daemon testDebugUnitTest lintDebug assembleDebug testPreviewUnitTest lintPreview assemblePreview 2>&1 | tee "$RUNNER_TEMP/preview-gradle.log"
            result=${PIPESTATUS[0]}
            set -e
            if test "$result" -eq 0; then break; fi
            if test "$attempt" -eq 3 || ! grep -Eiq 'Gateway Time-out|status code 50[234]|Could not (GET|HEAD)|Read timed out|Connect timed out' "$RUNNER_TEMP/preview-gradle.log"; then
              exit "$result"
            fi
            echo "Retrying transient dependency download ($attempt/3)"
            sleep 5
          done
          python3 .github/scripts/verify_packaged_card_details.py app/build/outputs/apk/preview/app-preview.apk
      - name: Verify identity and prepare coexistence checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p distribution
          cp app/build/outputs/apk/preview/app-preview.apk distribution/SWU-Collection-Test.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose distribution/SWU-Collection-Test.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging distribution/SWU-Collection-Test.apk > distribution/preview-identity.txt
          python3 - <<'PY'
          import json,re,hashlib,urllib.request,urllib.error,os,time,shutil,subprocess
          from pathlib import Path
          def fetch(request,path=None):
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as response:
                          if path is None:return json.load(response)
                          temporary=path.with_suffix(path.suffix+'.part')
                          with temporary.open('wb') as output:shutil.copyfileobj(response,output)
                          temporary.replace(path)
                      return
                  except (urllib.error.URLError,TimeoutError) as error:
                      if isinstance(error,urllib.error.HTTPError) and error.code not in (408,429,500,502,503,504):raise
                      if attempt==3:raise
                      print('Retrying transient reference download',attempt+1,flush=True)
                      time.sleep(3*(attempt+1))
          text=Path('distribution/preview-identity.txt').read_text()
          assert "package: name='fr.swucollection.app.test'" in text
          assert "application-label:'SWU Collection Test'" in text
          request=urllib.request.Request('https://api.github.com/repos/aRCen87/SWU-Collection-Releases/releases/latest',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=fetch(request)
          asset=next(a for a in data['assets'] if a['name']=='SWU-Collection.apk')
          path=Path('distribution/SWU-Collection-Official.apk')
          # The asset API avoids the unreliable browser release-download redirect.
          expected=asset['digest'].removeprefix('sha256:')
          for attempt in range(4):
              temporary=path.with_suffix('.apk.part')
              try:
                  with temporary.open('wb') as output:
                      result=subprocess.run(['gh','api',f"repos/aRCen87/SWU-Collection-Releases/releases/assets/{asset['id']}",'-H','Accept: application/octet-stream'],stdout=output,timeout=60)
                  if result.returncode==0 and temporary.stat().st_size==asset['size'] and hashlib.sha256(temporary.read_bytes()).hexdigest()==expected:
                      temporary.replace(path)
                      break
              except subprocess.TimeoutExpired:
                  print('Release asset API timed out; retrying',flush=True)
              if attempt==3:raise RuntimeError('The official reference asset could not be downloaded and verified.')
              time.sleep(3*(attempt+1))
          assert path.stat().st_size==asset['size']
          assert hashlib.sha256(path.read_bytes()).hexdigest()==asset['digest'].removeprefix('sha256:')
          Path('distribution/SOURCES.txt').write_text('Preview source: ${{ github.sha }}\nOfficial baseline: '+data['tag_name']+'\n')
          PY
      - name: Release compiler memory before graphics checks
        run: |
          gradle --stop || true
          jps -l | awk '/org.jetbrains.kotlin.daemon.KotlinCompileDaemon/ {print $1}' | xargs -r kill || true
          free -m
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # Chromium pins 37.1.11 to avoid 37.2.13 ProcessCleanupThread crashes.
          # https://chromium.googlesource.com/chromium/src/tools/android/+/0d2c7590ad90c5e3e5390a1d732ef2b2305d343d
          emulator-build: 15917651
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot-save -feature GLESDynamicVersion
          script: bash .github/scripts/smoke_premium_preview.sh
      - name: Encrypt the empty-account layout check for private review
        if: always()
        run: |
          mkdir -p distribution-layout-private
          for image in smoke-private/home-test*.png; do
            test -f "$image" || continue
            name=$(basename "$image" .png)
            python3 .github/scripts/encrypt_private_preview.py docs/preview-recipient-public.pem "$image" "distribution-layout-private/$name"
          done
      - name: Preserve encrypted emulator crash diagnostics
        if: always()
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          files=[p for root in Path('/tmp/android-runner').glob('emu-crash*') for p in ([root] if root.is_file() else root.rglob('*')) if p.is_file() and p.stat().st_size < 50_000_000]
          if files:
              Path('smoke-private').mkdir(exist_ok=True)
              with ZipFile('smoke-private/graphics-diagnostics.zip','w',ZIP_DEFLATED) as z:
                  for p in files:z.write(p,str(p.relative_to('/tmp/android-runner')))
          PYDIAG
          if test -f smoke-private/graphics-diagnostics.zip; then
            python3 .github/scripts/encrypt_private_preview.py docs/preview-recipient-public.pem smoke-private/graphics-diagnostics.zip distribution-layout-private/graphics-diagnostics
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SWU-Collection-Test-layout-encrypted
          retention-days: 7
          path: distribution-layout-private/
          if-no-files-found: ignore
      - name: Encrypt the validated test APK for private delivery
        run: python3 .github/scripts/encrypt_private_preview.py docs/preview-recipient-public.pem distribution/SWU-Collection-Test.apk distribution-private
      - uses: actions/upload-artifact@v4
        with:
          name: SWU-Collection-Test-encrypted
          retention-days: 30
          path: distribution-private/
          if-no-files-found: error
