name: Encrypted SWU Collection Test
on:
  push:
    branches: ["preview/private-sandbox", "preview/profile-avatars-test17", "preview/reliability-test18"]
    paths-ignore: ["docs/preview-update.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-swu-preview
  cancel-in-progress: true
jobs:
  security:
    if: github.repository == 'aRCen87/SWU-Collection-Public' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify private profiles and conversation access
        working-directory: social
        run: |
          npm ci --no-audit --no-fund
          npm test
  build:
    needs: security
    if: github.repository == 'aRCen87/SWU-Collection-Public' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aRCen87/SWU-Collection-Public
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false
      - name: Load permanent signing identity privately
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/swu-preview.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/swu-preview.jks" >> "$GITHUB_ENV"
      - name: Prepare the isolated test backend configuration
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: java .github/scripts/DecryptPreviewConfig.java docs/test-backend-config.enc.properties
      - run: python3 -m pip install 'cryptography>=44,<47'
      - name: Test stable code and the isolated preview
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug testPreviewUnitTest lintPreview assemblePreview
          python3 .github/scripts/verify_packaged_card_details.py app/build/outputs/apk/preview/app-preview.apk
      - name: Verify identity and prepare coexistence checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p distribution
          cp app/build/outputs/apk/preview/app-preview.apk distribution/SWU-Collection-Test.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose distribution/SWU-Collection-Test.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging distribution/SWU-Collection-Test.apk > distribution/preview-identity.txt
          python3 - <<'PY'
          import json,re,hashlib,urllib.request,os
          from pathlib import Path
          text=Path('distribution/preview-identity.txt').read_text()
          assert "package: name='fr.swucollection.app.test'" in text
          assert "application-label:'SWU Collection Test'" in text
          request=urllib.request.Request('https://api.github.com/repos/aRCen87/SWU-Collection-Releases/releases/latest',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=json.load(urllib.request.urlopen(request,timeout=30))
          asset=next(a for a in data['assets'] if a['name']=='SWU-Collection.apk')
          path=Path('distribution/SWU-Collection-Official.apk')
          urllib.request.urlretrieve(asset['browser_download_url'],path)
          assert path.stat().st_size==asset['size']
          assert hashlib.sha256(path.read_bytes()).hexdigest()==asset['digest'].removeprefix('sha256:')
          Path('distribution/SOURCES.txt').write_text('Preview source: ${{ github.sha }}\nOfficial baseline: '+data['tag_name']+'\n')
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          ram-size: 3072M
          emulator-boot-timeout: 300
          disable-animations: true
          script: bash .github/scripts/smoke_private_preview.sh
      - name: Encrypt the empty-account layout check for private review
        if: always()
        run: |
          mkdir -p distribution-layout-private
          for image in smoke-private/home-test*.png; do
            test -f "$image" || continue
            name=$(basename "$image" .png)
            python3 .github/scripts/encrypt_private_preview.py docs/preview-recipient-public.pem "$image" "distribution-layout-private/$name"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SWU-Collection-Test-layout-encrypted
          retention-days: 7
          path: distribution-layout-private/
          if-no-files-found: ignore
      - name: Encrypt the validated test APK for private delivery
        run: python3 .github/scripts/encrypt_private_preview.py docs/preview-recipient-public.pem distribution/SWU-Collection-Test.apk distribution-private
      - uses: actions/upload-artifact@v4
        with:
          name: SWU-Collection-Test-encrypted
          retention-days: 30
          path: distribution-private/
          if-no-files-found: error
