name: Test 35 focused presentation check
on:
  push:
    branches: ["preview/design-test35"]
    paths-ignore: ["docs/preview-update.json"]
permissions:
  contents: read
concurrency:
  group: swu-design-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    if: github.repository == 'aRCen87/SWU-Collection-Public' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false
      - name: Compile the disposable production-component fixtures
        run: gradle --no-daemon --no-parallel --max-workers=1 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" assembleDebug assembleDebugAndroidTest
      - name: Release compiler memory
        run: |
          gradle --stop || true
          jps -l | awk '/org.jetbrains.kotlin.daemon.KotlinCompileDaemon/ {print $1}' | xargs -r kill || true
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15917651
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot-save -feature GLESDynamicVersion
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            bash .github/scripts/check_design35.sh
      - name: Encrypt diagnostic views for private review
        if: always()
        run: |
          python3 -m pip install 'cryptography>=44,<47'
          mkdir -p design-probe-private
          for image in smoke-private/home-test*.png; do
            test -f "$image" || continue
            name=$(basename "$image" .png)
            python3 .github/scripts/encrypt_private_preview.py docs/preview-recipient-public.pem "$image" "design-probe-private/$name"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SWU-design-probe-encrypted
          retention-days: 7
          path: design-probe-private/
          if-no-files-found: ignore
