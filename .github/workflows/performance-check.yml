name: Test performance and usability changes
on:
  push:
    branches: ["preview/performance-test19"]
permissions:
  contents: read
concurrency:
  group: performance-test19
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - run: python3 .github/scripts/verify_packaged_card_details.py app/build/outputs/apk/debug/app-debug.apk
