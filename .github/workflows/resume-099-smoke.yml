name: Resume 0.9.9 emulator validation
on:
  push:
    branches: [ "release/quick-collection-099" ]
    paths:
      - ".github/scripts/check_*.py"
      - ".github/workflows/resume-099-smoke.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: resume-099-smoke
  cancel-in-progress: true
jobs:
  startup:
    name: Verify Android startup and primary navigation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable APK sources match this checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/aRCen87/SWU-Collection-Public/actions/runs/44614817530 --jq .head_sha)" = 0bb45d54b1ec58112ce7682c9e372a4a317f04fd
          git diff --exit-code 0bb45d54b1ec58112ce7682c9e372a4a317f04fd HEAD -- app build.gradle.kts settings.gradle.kts gradle.properties gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install tools for the signed upgrade check
        run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44614817530
          github-token: ${{ github.token }}
          name: swu-startup-apk
          path: app/build/outputs/apk/release
      - run: python3 -m pip install "Pillow>=11,<13"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the final optimized APK twice on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SWU_RELEASE_VALIDATION: 'false'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-build: 15917651
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot-save -feature GLESDynamicVersion
          script: |
            mkdir -p smoke-private
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm grant fr.swucollection.app android.permission.POST_NOTIFICATIONS
            SWU_SMOKE_PACKAGE=fr.swucollection.app python3 .github/scripts/check_premium_collection.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app python3 .github/scripts/check_test19_usability.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app python3 .github/scripts/check_collection_workbench.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app python3 .github/scripts/check_private_fold_interactions.py
            SWU_SMOKE_PACKAGE=fr.swucollection.app python3 .github/scripts/check_match_counter.py
            adb shell am force-stop fr.swucollection.app
            adb shell am start -W -n fr.swucollection.app/fr.swucollection.app.MainActivity
            sleep 8
            if [ "$SWU_RELEASE_VALIDATION" = true ]; then python3 .github/scripts/check_official_account_entry.py && python3 .github/scripts/check_official_upgrade.py; fi
      - name: Upload startup verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swu-resumed-startup-verification
          path: smoke-private/
          if-no-files-found: ignore
